<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdix | Holistic Case Assessment System</title>
  <meta name="description" content="Verdix is a secure, compliant platform that learns continuously to provide attorneys & lawyers with synthesized wisdom." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
  <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="assets/favicon/favicon.ico" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-navy: #00335A;
      --color-navy-deep: #001E37;
      --color-peach: #FFDFCB;
      --color-blue-400: #176CAD;
      --color-blue-600: #184C8F;
      --color-white: #FFFFFF;
      --color-blue-200: #A9DAFF;
      --grid-size: 56px;
      --mx: 50%;
      --my: 50%;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--color-white);
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    html { background: #465B6C; }

    /* ─── Background gradient ─── */
    .bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #00335A 0%, #FFDFCB 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Grid (cursor-reactive) ─── */
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.28) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.28) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      -webkit-mask-image: radial-gradient(circle 240px at var(--mx) var(--my), rgba(0,0,0,1) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0) 100%);
              mask-image: radial-gradient(circle 240px at var(--mx) var(--my), rgba(0,0,0,1) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0) 100%);
    }
    /* baseline subtle grid — always visible across the whole page */
    .grid-base {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
    }
    /* ─── Layout ─── */
    .page {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      /* Padding is exactly 1 grid cell on every side → content starts on a grid line */
      padding: var(--grid-size);
      display: grid;
      grid-template-rows: var(--grid-size) 1fr auto;
      gap: clamp(16px, 2vw, 24px);
    }

    /* ─── Header (sits in row 1, exactly 1 grid cell tall) ─── */
    .header {
      height: var(--grid-size);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo svg { display: block; width: clamp(120px, 11vw, 161px); height: auto; max-height: 100%; }


    /* ─── Headline ─── */
    .headline-wrap {
      align-self: center;
      width: 100%;
    }
    h1 {
      font-family: "DM Sans", sans-serif;
      font-weight: 300;
      /* Per Figma spec: letter-spacing -8.646/172.929 ≈ -0.05em,
         line-height 157.443/172.929 ≈ 0.91 — proportional, so they scale
         with font-size at every viewport. */
      letter-spacing: -0.05em;
      line-height: 0.91;
      /* Fluid type: scales smoothly with both width and height so it stays
         in proportion on tall narrow phones, ultrawide monitors, and short
         windows alike. */
      font-size: clamp(40px, min(13vw, 22vh), 240px);
      color: var(--color-white);
      white-space: pre-wrap;
    }
    .word { display: inline-block; overflow: hidden; padding-bottom: 0.04em; }
    .char { display: inline-block; will-change: transform, filter, opacity; }

    /* ─── Footer (subtitle + CTA) ─── */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(20px, 2vw, 32px);
    }
    .subtitle {
      max-width: none;
      width: fit-content;
      font-size: clamp(20px, min(1.9vw, 2.9vh), 32px);
      line-height: 1.35;
      color: #465B6C;
      will-change: transform, opacity;
    }
    .subtitle-line { display: block; white-space: nowrap; }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 24px;
      background: #00335A;
      color: var(--color-white);
      font-family: "Inter", sans-serif;
      font-weight: 700;
      font-size: clamp(18px, min(1.6vw, 2.5vh), 25px);
      padding: clamp(22px, min(2.4vw, 3.4vh), 36px) clamp(34px, min(3.4vw, 4.8vh), 62px);
      border-radius: 16px;
      text-decoration: none;
      letter-spacing: 0.04em;
      /* GSAP drives transform & shadow on hover; CSS handles color so we never
         fight the engine over the same property. */
      transition: background-color 0.2s ease, box-shadow 0.3s ease;
      will-change: transform, opacity;
      box-shadow: 0 4px 16px rgba(0,51,90,0.18);
    }
    .cta:hover { background: #002544; box-shadow: 0 8px 28px rgba(0,51,90,0.40); }
    .cta-arrow { display: inline-block; will-change: transform; }
    .cta-inner { display: inline-flex; align-items: center; gap: 24px; will-change: transform; }
    @media (prefers-reduced-motion: reduce) {
      .cta { transition: background-color 0.2s ease; box-shadow: none; }
      .cta:hover { box-shadow: none; }
    }

    /* Mid-size laptops & older displays — pull header + CTA in a notch
       so the page feels balanced when the viewport is below 1300px wide. */
    @media (max-width: 1300px) {
      .logo svg { width: clamp(108px, 9vw, 138px); }
      .header  { height: 48px; }
      .page    { padding: 48px; grid-template-rows: 48px 1fr auto; }
      .cta {
        font-size: clamp(15px, min(1.35vw, 2.1vh), 21px);
        padding:   clamp(16px, min(1.9vw, 2.7vh), 28px)
                   clamp(26px, min(2.7vw, 3.8vh), 50px);
        border-radius: 14px;
        gap: 18px;
      }
      .subtitle {
        font-size: clamp(17px, min(1.55vw, 2.4vh), 26px);
      }
    }

    /* Below 1200px the floating cards shrink ~30% so they don't dominate
       the right column on smaller laptops & tablets. Every Figma value is
       scaled by 0.7 from the default 1.5× spec (= ~1.05× the original).
       The page headline also shrinks ~25% so the proportion stays right. */
    @media (max-width: 1200px) {
      h1 { font-size: clamp(32px, min(9.5vw, 16vh), 160px); }
    }

    @media (max-width: 720px) {
      .footer { gap: 16px; }
    }

    /* ─── Impression cards (floating testimonials, top-most layer) ─── */
    .impression-card {
      position: fixed;
      display: flex;
      /* 1.5× the Figma spec — all values multiplied by 1.5 for visual scale up */
      width: 573px;
      padding: 77.714px 60.654px 72.027px 47.387px;
      flex-direction: column;
      align-items: flex-start;
      gap: 87px;
      border-radius: 32.223px;
      background: rgba(255, 255, 255, 0.22);
      -webkit-backdrop-filter: blur(12.15px);
              backdrop-filter: blur(12.15px);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 18px 60px rgba(0,51,90,0.20);
      z-index: 100;
      pointer-events: auto;
      will-change: transform, opacity;
      color: #00335A;
      font-family: "DM Sans", sans-serif;
      cursor: default;
      top: 0; left: 0; /* GSAP drives x/y */
    }
    .impression-quote {
      font-size: 28.5px;
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: -0.005em;
      margin: 0;
    }
    .impression-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .impression-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .impression-title {
      font-size: 21px;
      font-weight: 400;
      opacity: 0.75;
      letter-spacing: 0.01em;
    }
    /* Card scaling — placed AFTER the base .impression-card rule so the
       media-query overrides actually win (CSS source order with equal
       specificity). */
    @media (max-width: 1200px) {
      .impression-card {
        width: clamp(300px, 38vw, 401px);
        padding: clamp(34px, 4.5vw, 54.4px)
                 clamp(26px, 3.5vw, 42.5px)
                 clamp(32px, 4.2vw, 50.4px)
                 clamp(20px, 2.8vw, 33.2px);
        gap: clamp(36px, 5vw, 61px);
        border-radius: clamp(16px, 1.9vw, 22.5px);
        -webkit-backdrop-filter: blur(8.5px);
                backdrop-filter: blur(8.5px);
      }
      .impression-quote { font-size: clamp(15px, 1.7vw, 20px); line-height: 1.4; }
      .impression-name  { font-size: clamp(14px, 1.45vw, 17px); }
      .impression-title { font-size: clamp(12px, 1.25vw, 15px); }
    }
    @media (max-width: 720px) {
      /* Cap to 340px so the card doesn't balloon when 88vw exceeds it on tablets */
      .impression-card { width: min(88vw, 340px); padding: 32px 24px 28px 20px; gap: 36px; border-radius: 18px; }
      .impression-quote { font-size: 17px; line-height: 1.4; }
      .impression-name { font-size: 15px; }
      .impression-title { font-size: 13px; }
    }


    /* Initial state for animation */
    .char { opacity: 0; transform: translateY(60%) scale(1.08); filter: blur(14px); }
    .subtitle, .cta, .header { opacity: 0; }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    /* ── Split headline into chars wrapped in words (preserves spaces) ── */
    (function splitHeadline() {
      const h1 = document.querySelector('[data-headline]');
      const text = h1.textContent;
      h1.textContent = '';
      const frag = document.createDocumentFragment();
      text.split(' ').forEach((word, wi, arr) => {
        const wordEl = document.createElement('span');
        wordEl.className = 'word';
        [...word].forEach(ch => {
          const c = document.createElement('span');
          c.className = 'char';
          c.textContent = ch;
          wordEl.appendChild(c);
        });
        frag.appendChild(wordEl);
        if (wi < arr.length - 1) {
          const space = document.createElement('span');
          space.className = 'word';
          const s = document.createElement('span');
          s.className = 'char';
          s.innerHTML = '&nbsp;';
          space.appendChild(s);
          frag.appendChild(space);
        }
      });
      h1.appendChild(frag);
    })();

    /* ── GSAP intro: sequential pixelate-style reveal ── */
    window.addEventListener('load', () => {
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      tl.to('.header', { opacity: 1, duration: 0.6 })
        .to('.char', {
          opacity: 1,
          y: 0,
          scale: 1,
          filter: 'blur(0px)',
          duration: 0.7,
          stagger: { amount: 1.2, from: 'start' },
        }, '-=0.2')
        .fromTo('.subtitle',
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.7 }, '-=0.5')
        .fromTo('.cta',
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.7, onComplete: enableCtaMicro }, '-=0.5');
    });

    /* ── GSAP best-practice CTA micro-interaction ──
       Patterns applied (interaction-design + GSAP core):
       - quickTo for high-frequency mousemove (no GC pressure, smoother)
       - Magnetic outer translation, parallax inner translation, arrow slide
       - power3.out on engage, elastic.out on release for a tactile snap-back
       - press-down state on pointerdown for haptic feedback
       - prefers-reduced-motion bypasses transforms entirely
    */
    function enableCtaMicro() {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;

      const cta   = document.querySelector('.cta');
      const inner = cta.querySelector('.cta-inner');
      const arrow = cta.querySelector('.cta-arrow');
      if (!cta || !inner || !arrow) return;

      // Performant tweens (recommended GSAP pattern for mousemove)
      const xTo = gsap.quickTo(cta,   'x', { duration: 0.5, ease: 'power3.out' });
      const yTo = gsap.quickTo(cta,   'y', { duration: 0.5, ease: 'power3.out' });
      const ixTo = gsap.quickTo(inner, 'x', { duration: 0.6, ease: 'power3.out' });
      const iyTo = gsap.quickTo(inner, 'y', { duration: 0.6, ease: 'power3.out' });

      const MAGNETIC_STRENGTH = 0.30; // 30% of distance to centre
      const INNER_STRENGTH    = 0.55; // inner content drifts a bit MORE for parallax

      let bounds = null;
      const refreshBounds = () => { bounds = cta.getBoundingClientRect(); };

      cta.addEventListener('pointerenter', () => {
        refreshBounds();
        gsap.to(arrow, { x: 10, duration: 0.45, ease: 'power3.out' });
        gsap.to(cta,   { scale: 1.04, duration: 0.45, ease: 'power3.out' });
      });

      cta.addEventListener('pointermove', (e) => {
        if (!bounds) refreshBounds();
        const cx = bounds.left + bounds.width  / 2;
        const cy = bounds.top  + bounds.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        xTo(dx * MAGNETIC_STRENGTH);
        yTo(dy * MAGNETIC_STRENGTH);
        ixTo(dx * (INNER_STRENGTH - MAGNETIC_STRENGTH));
        iyTo(dy * (INNER_STRENGTH - MAGNETIC_STRENGTH));
      });

      cta.addEventListener('pointerleave', () => {
        // Elastic snap-back — feels tactile without overshooting too much
        gsap.to(cta,   { x: 0, y: 0, scale: 1, duration: 0.85, ease: 'elastic.out(1, 0.45)' });
        gsap.to(inner, { x: 0, y: 0,           duration: 0.85, ease: 'elastic.out(1, 0.45)' });
        gsap.to(arrow, { x: 0,                 duration: 0.45, ease: 'power3.out' });
      });

      // Tactile press
      cta.addEventListener('pointerdown', () => {
        gsap.to(cta, { scale: 0.96, duration: 0.12, ease: 'power2.out' });
      });
      cta.addEventListener('pointerup', () => {
        gsap.to(cta, { scale: 1.04, duration: 0.25, ease: 'power3.out' });
      });

      // Keep bounds fresh on resize/scroll
      window.addEventListener('resize', refreshBounds);
      window.addEventListener('scroll', refreshBounds, { passive: true });
    }

    /* ── Floating impression cards ────────────────────────────────────────
       10 short reactions from real-feeling personas across CH / CA / USA.
       Cards fly in from a screen edge, drift gently, then fly out the
       opposite side. 2–3 are on screen at a time. Hover pauses the drift
       and lifts the card slightly for closer reading. */
    const IMPRESSIONS = [
      // General excitement about the platform, the possibilities ahead, and
      // where the domain is heading. No feature names. No specific cases.
      // Mix of humble personal admissions and quiet conviction.

      // Attorneys
      { name: 'Lukas B.',   country: 'Zurich, CH',         role: 'Attorney',
        quote: '“Felt a shift in how I’ll work next year.”' },
      { name: 'Elena V.',   country: 'San Francisco, USA', role: 'Attorney',
        quote: '“Walked in cautious. Walked out wanting to share it.”' },

      // Divorce lawyers
      { name: 'Camille T.', country: 'Montréal, CA',       role: 'Divorce Lawyer',
        quote: '“Hopeful for clients in ways I haven’t been before.”' },
      { name: 'Marc D.',    country: 'Genève, CH',         role: 'Divorce Lawyer',
        quote: '“Something here is going to matter. I can feel it.”' },

      // Legal IT
      { name: 'Daniel O.',  country: 'Boston, USA',        role: 'Legal IT Automation Officer',
        quote: '“This is the direction our profession needed to go.”' },
      { name: 'Aisha P.',   country: 'Vancouver, CA',      role: 'Legal IT Automation Officer',
        quote: '“Already imagining what our firm could become.”' },

      // CEOs
      { name: 'Sofia R.',   country: 'Basel, CH',          role: 'CEO',
        quote: '“A glimpse of where serious legal work is heading.”' },
      { name: 'Robert K.',  country: 'Chicago, USA',       role: 'CEO',
        quote: '“Hard to look at the field the same way.”' },

      // Investors
      { name: 'James W.',   country: 'Toronto, CA',        role: 'Private Investor',
        quote: '“Something rare here. The kind worth paying attention to.”' },
      { name: 'Yann S.',    country: 'Lausanne, CH',       role: 'Private Investor',
        quote: '“Optimistic in a way I haven’t been in years.”' },
    ];

    (function impressionStream() {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;

      const CARD_W = 573;          // 1.5× the Figma spec
      const CARD_H = 420;          // rough — used for spawn math, real height self-measures
      const ENTRY_S = 1.45;
      const DWELL_S = 4.8;
      const EXIT_S  = 1.55;
      const LIFETIME_S = ENTRY_S + DWELL_S + EXIT_S;  // ≈ 7.8 s
      // Spawn the next card at half the lifetime so two cards continuously
      // overlap on screen — never appearing or leaving in pairs.
      const SPAWN_OFFSET_S = LIFETIME_S * 0.5;
      const DWELL_MS = DWELL_S * 1000;

      let order = gsap.utils.shuffle([...IMPRESSIONS.keys()]);
      let cursor = 0;
      let alive = new Set();

      function nextIndex() {
        if (cursor >= order.length) {
          order = gsap.utils.shuffle([...IMPRESSIONS.keys()]);
          cursor = 0;
        }
        return order[cursor++];
      }

      function buildCard(data) {
        const card = document.createElement('article');
        card.className = 'impression-card';
        card.innerHTML = `
          <p class="impression-quote">${data.quote}</p>
          <div class="impression-meta">
            <div class="impression-name">${data.name}</div>
            <div class="impression-title">${data.role} · ${data.country}</div>
          </div>`;
        return card;
      }

      function spawn() {
        // Single-chain spawner: each call schedules its own successor at
        // SPAWN_OFFSET_S so we always have continuous 2-card overlap.
        gsap.delayedCall(SPAWN_OFFSET_S, spawn);

        const data = IMPRESSIONS[nextIndex()];
        const card = buildCard(data);
        // Pre-position off-screen before measuring so it doesn't flash
        card.style.transform = 'translate(-9999px, -9999px)';
        document.body.appendChild(card);
        alive.add(card);

        // Cards live only on the RIGHT HALF of the viewport (vw 50%+),
        // flying upward from below the fold to above it.
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        // Measure the card's actual rendered size so spawn math respects the
        // current breakpoint's downscaled dimensions.
        const cardRect = card.getBoundingClientRect();
        const realW = cardRect.width  || CARD_W;
        const realH = cardRect.height || CARD_H;

        // Confine x to the right half, leaving the card's own width in mind.
        const rightHalfStart = vw * 0.50;
        const rightHalfEnd   = Math.max(rightHalfStart + 20, vw - realW - 24);
        const lane = gsap.utils.random(rightHalfStart, rightHalfEnd);

        // Pick a vertical band that none of the currently-alive cards are using,
        // so multiple cards on screen don't pile on top of each other.
        // Widened ranges + an extra jitter so consecutive cards in the same
        // band still land at meaningfully different Y positions.
        const BANDS = [
          { yMin: vh * 0.02, yMax: vh * 0.22 },  // top
          { yMin: vh * 0.30, yMax: vh * 0.50 },  // middle
        ];
        const usedBands = new Set();
        alive.forEach(el => { if (el !== card && el.dataset.band) usedBands.add(+el.dataset.band); });
        const freeBands = BANDS.map((_, i) => i).filter(i => !usedBands.has(i));
        const bandIdx = freeBands.length
          ? freeBands[Math.floor(Math.random() * freeBands.length)]
          : Math.floor(Math.random() * BANDS.length);
        card.dataset.band = bandIdx;
        const band = BANDS[bandIdx];

        // Simple straight-line motion: bottom → target → off the top.
        const startX = lane;
        const startY = vh + 60;                                // below the fold
        const targetX = lane + gsap.utils.random(-20, 20);
        const baseTargetY = gsap.utils.random(band.yMin, band.yMax);
        const targetY = baseTargetY + gsap.utils.random(-vh * 0.04, vh * 0.04);
        const exitX  = lane + gsap.utils.random(-30, 30);
        const exitY  = -realH - 80;                            // above the fold

        const baseTilt  = gsap.utils.random(-10, 10);  // landing tilt
        const enterTilt = gsap.utils.random(-14, 14);  // off-screen start tilt

        gsap.set(card, {
          x: startX,
          y: startY,
          rotation: enterTilt,
          opacity: 0,
          scale: 0.94,
        });

        // Drift during dwell — tiny upward bob to match the bottom→top flow.
        const drift = gsap.to(card, {
          y: '-=18',
          rotation: baseTilt + (Math.random() < 0.5 ? 1.4 : -1.4),
          duration: gsap.utils.random(3.4, 4.4),
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1,
          paused: true,
        });

        const tl = gsap.timeline({
          onComplete: () => {
            drift.kill();
            card.remove();
            alive.delete(card);
          },
        });

        tl.to(card, {
          x: targetX,
          y: targetY,
          rotation: baseTilt,
          opacity: 1,
          scale: 1,
          duration: ENTRY_S,
          ease: 'power3.out',
          onComplete: () => drift.play(),
        })
          .to({}, { duration: DWELL_S }) // dwell while drift runs
          .to(card, {
            x: exitX,
            y: exitY,
            rotation: baseTilt + (Math.random() < 0.5 ? -10 : 10),
            opacity: 0,
            scale: 0.96,
            duration: EXIT_S,
            ease: 'power3.in',
            onStart: () => drift.pause(),
          });

        // ── Interactivity: hover pauses drift + lifts card slightly ──
        card.addEventListener('pointerenter', () => {
          drift.pause();
          gsap.to(card, { scale: 1.04, duration: 0.45, ease: 'power3.out' });
          tl.timeScale(0.3); // slow the dwell timeline so the user can read
        });
        card.addEventListener('pointerleave', () => {
          gsap.to(card, { scale: 1, duration: 0.5, ease: 'power3.out',
            onComplete: () => drift.resume() });
          tl.timeScale(1);
        });
      }

      // Single kickoff. spawn() schedules its own successor at half the
      // lifetime, producing a continuous overlap (each new card enters while
      // the previous is mid-dwell) — never in synchronised pairs.
      gsap.delayedCall(2.0, spawn);
    })();

    /* ── Cursor-reactive grid ── */
    (function cursorGrid() {
      const root = document.documentElement;
      let targetX = window.innerWidth / 2;
      let targetY = window.innerHeight / 2;
      let curX = targetX;
      let curY = targetY;

      window.addEventListener('mousemove', (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
      });

      function loop() {
        // ease toward target for buttery feel
        curX += (targetX - curX) * 0.12;
        curY += (targetY - curY) * 0.12;
        root.style.setProperty('--mx', curX + 'px');
        root.style.setProperty('--my', curY + 'px');
        requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
</body>
