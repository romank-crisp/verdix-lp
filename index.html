<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdix | Legal Intelligence For Modern Law Practice</title>
  <meta name="description" content="Secure, Swiss-hosted, and compliant by design; Verdix brings your firm's knowledge together so you can act on it." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
  <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="assets/favicon/favicon.ico" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-navy: #00335A;
      --color-navy-deep: #001E37;
      --color-peach: #FFDFCB;
      --color-blue-400: #176CAD;
      --color-blue-600: #184C8F;
      --color-white: #FFFFFF;
      --color-blue-200: #A9DAFF;
      --grid-size: 40px;
      --page-padding: var(--grid-size);
      --bar-height: 118px;
      --column-gap: clamp(22px, 3.5vw, 64px);
      --form-bottom-offset: 96px;
      --button-tail-offset: 21px;
      --copy-gap: clamp(42px, 7.9vh, 82px);
      --copy-bottom-offset: calc(var(--form-bottom-offset) + var(--button-tail-offset));
      --control-font-size: clamp(13px, min(1.12vw, 1.75vh), 18px);
    }

    html, body {
      width: 100vw;
      min-height: 100dvh;       /* dynamic viewport height — handles iOS URL bar */
      background: transparent;
      color: var(--color-white);
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Fallback for browsers without dvh support */
    @supports not (height: 100dvh) {
      html, body { min-height: 100vh; }
    }
    html { background: #176CAD; }
    body { overflow-x: hidden; }

    /* ─── Image background ─── */
    .bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(23,108,173,0.08), rgba(23,108,173,0.08)),
        url("assets/verdix-background.png") center / cover no-repeat;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Layout ─── */
    .page {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100dvh;
      /* Padding is exactly 1 grid cell on every side → content starts on a grid line */
      padding: 0 var(--page-padding);
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) var(--bar-height);
      column-gap: var(--column-gap);
      row-gap: 0;
    }
    .page::before {
      content: "";
      position: absolute;
      top: 0;
      left: calc(var(--page-padding) + ((100% - (var(--page-padding) * 2) - (var(--column-gap) * 2)) * 0.4) + (var(--column-gap) / 2));
      width: 1px;
      height: 100%;
      background: rgba(255,255,255,0.18);
      pointer-events: none;
    }
    .page::after {
      content: "";
      position: absolute;
      top: 0;
      left: calc(var(--page-padding) + ((100% - (var(--page-padding) * 2) - (var(--column-gap) * 2)) * 0.8) + (var(--column-gap) * 1.5));
      width: 1px;
      height: 100%;
      background: rgba(255,255,255,0.18);
      pointer-events: none;
    }
    .left-column {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(13px, 1.68vw, 20px);
    }
    .content-slot {
      display: grid;
      align-items: end;
      padding-bottom: var(--copy-bottom-offset);
    }

    /* ─── Header (auto-height to fit the logo) + hairline below ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      height: var(--bar-height);
    }
    .header::after,
    .page-footer::before {
      content: "";
      position: absolute;
      left: 0;
      width: calc(100vw - (var(--page-padding) * 2));
      height: 1px;
      background: rgba(255,255,255,0.18);
      pointer-events: none;
    }
    .header::after { bottom: 0; }
    .logo {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .logo svg { display: block; width: clamp(95px, 9.45vw, 169px); height: auto; }


    /* ─── Headline ─── */
    .headline-wrap {
      width: min(60vw, 100%);
      max-width: 100%;
      min-width: 0;        /* allow shrinking below intrinsic word width */
    }
    .copy-stack {
      align-self: end;
      display: grid;
      gap: var(--copy-gap);
    }
    h1 {
      font-family: "DM Sans", sans-serif;
      font-weight: 300;
      overflow-wrap: break-word;
      color: #FFFFFF;
      /* Per Figma spec: letter-spacing -8.646/172.929 ≈ -0.05em,
         line-height 157.443/172.929 ≈ 0.91 — proportional, so they scale
         with font-size at every viewport. */
      letter-spacing: -0.05em;
      line-height: 0.91;
      /* Fluid type: scales smoothly with both width and height so it stays
         in proportion on tall narrow phones, ultrawide monitors, and short
         windows alike. */
      font-size: clamp(20px, min(4.35vw, 9.7vh), 106px);
      color: var(--color-white);
      white-space: pre-wrap;
    }
    .word { display: inline-block; overflow: hidden; margin-right: 0.18em; padding-right: 3px; padding-bottom: 0.16em; }
    .word:last-child { margin-right: 0; }
    .char {
      display: inline-block;
      will-change: transform, filter, opacity;
      color: #FFFFFF;
    }

    /* ─── Text block ─── */
    .footer {
      position: relative;
    }
    .subtitle {
      max-width: min(760px, 100%);
      font-size: clamp(16px, min(1.41vw, 2.18vh), 26px);
      line-height: 1.5;
      color: #FFFFFF;
      will-change: transform, opacity;
    }
    .subtitle-line { display: block; }

    /* ─── Lead form ─── */
    .form-column {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      align-items: end;
      justify-items: center;
      gap: clamp(20px, 2.52vw, 34px);
      min-width: 0;
      padding-top: var(--bar-height);
      padding-bottom: var(--form-bottom-offset);
    }
    .empty-column {
      grid-column: 3;
      grid-row: 1;
      min-width: 0;
    }
    .page-footer {
      grid-column: 1 / -1;
      grid-row: 2;
      position: relative;
      height: var(--bar-height);
      display: flex;
      align-items: center;
    }
    .page-footer::before { top: 0; }
    .footer-copy {
      color: rgba(255,255,255,0.56);
      font-family: "Inter", sans-serif;
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    .lead-form {
      width: 100%;
      max-width: 700px;
      display: grid;
      gap: clamp(13px, 1.68vh, 18px);
      will-change: transform, opacity;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    .field label {
      font-family: "Inter", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.78);
    }
    .field input {
      width: 100%;
      min-height: clamp(48px, min(4.9vw, 6.3vh), 64px);
      border: 1px solid rgba(255,255,255,0.34);
      border-radius: 10px;
      background: rgba(255,255,255,0.10);
      color: var(--color-white);
      font-family: "Inter", sans-serif;
      font-size: var(--control-font-size);
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0 clamp(14px, 1.4vw, 21px);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .field input::placeholder { color: rgba(255,255,255,0.42); }
    .field input:focus {
      border-color: rgba(255,255,255,0.86);
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.10);
    }
    .field input[aria-invalid="true"] {
      border-color: var(--color-peach);
      box-shadow: 0 0 0 4px rgba(255,223,203,0.14);
    }
    .field-error {
      min-height: 13px;
      color: var(--color-peach);
      font-family: "Inter", sans-serif;
      font-size: 10px;
      line-height: 1.35;
    }
    .consent {
      display: grid;
      gap: 7px;
    }
    .consent-label {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 14px;
      align-items: start;
      color: rgba(255,255,255,0.82);
      font-family: "Inter", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      cursor: pointer;
    }
    .consent input {
      width: 28px;
      height: 28px;
      margin-top: 1px;
      accent-color: var(--color-navy);
      cursor: pointer;
    }
    .consent a {
      color: var(--color-white);
      text-underline-offset: 3px;
    }
    .consent input[aria-invalid="true"] {
      outline: 2px solid var(--color-peach);
      outline-offset: 2px;
    }
    .lead-button {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 17px;
      width: 100%;
      background: #00335A;
      color: var(--color-white);
      font-family: "Inter", sans-serif;
      font-weight: 700;
      font-size: var(--control-font-size);
      padding: clamp(15px, min(1.68vw, 2.38vh), 25px) clamp(24px, min(2.38vw, 3.36vh), 43px);
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background-color 0.2s ease, box-shadow 0.3s ease;
      will-change: transform, opacity;
      box-shadow: 0 4px 16px rgba(0,51,90,0.18);
    }
    .lead-button:hover { background: #002544; box-shadow: 0 8px 28px rgba(0,51,90,0.40); }
    .lead-button:disabled { cursor: wait; opacity: 0.72; }
    .button-arrow { display: inline-block; will-change: transform; }
    .button-inner { display: inline-flex; align-items: center; gap: 17px; will-change: transform; }
    .form-message {
      display: none;
      width: 100%;
      max-width: 560px;
      font-size: clamp(18px, min(2.1vw, 3.5vh), 34px);
      line-height: 1.08;
      color: var(--color-white);
      opacity: 0;
      transform: translateY(13px);
    }
    .form-status {
      min-height: 15px;
      color: var(--color-peach);
      font-family: "Inter", sans-serif;
      font-size: 10px;
      line-height: 1.4;
    }
    @media (prefers-reduced-motion: reduce) {
      .lead-button { transition: background-color 0.2s ease; box-shadow: none; }
      .lead-button:hover { box-shadow: none; }
    }

    /* Mid-size laptops (incl. MacBook 14" at default scaling ≈ 1512px) —
       pull header + form controls in a notch so the page feels balanced. */
    @media (max-width: 1600px) {
      .logo svg { width: clamp(113px, 9.45vw, 145px); }
      :root { --page-padding: 32px; }
      :root { --control-font-size: clamp(11px, min(0.945vw, 1.47vh), 15px); }
      .lead-button {
        font-size: clamp(11px, min(0.945vw, 1.47vh), 15px);
        padding:   clamp(11px, min(1.33vw, 1.89vh), 20px)
                   clamp(18px, min(1.89vw, 2.66vh), 35px);
        border-radius: 10px;
        gap: 13px;
      }
      .subtitle { font-size: clamp(14px, min(1.23vw, 1.91vh), 20px); }
    }

    /* Below 1200px the floating cards shrink ~30% so they don't dominate
       the right column on smaller laptops & tablets. Every Figma value is
       scaled by 0.7 from the default 1.5× spec (= ~1.05× the original).
       The page headline also shrinks ~25% so the proportion stays right. */
    @media (max-width: 1600px) {
      /* Cap headline at 100px below the breakpoint */
      h1 { font-size: clamp(15px, min(3.43vw, 5.88vh), 49px); }
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
        gap: clamp(20px, 3.5vw, 34px);
      }
      .page::before { display: none; }
      .page::after { display: none; }
      .left-column,
      .form-column,
      .empty-column {
        grid-column: 1;
      }
      .form-column { grid-row: auto; }
      .form-column {
        align-items: center;
        padding-top: 0;
        padding-bottom: 0;
      }
      .content-slot {
        align-items: center;
        padding-bottom: 0;
      }
      .copy-stack {
        align-self: center;
        gap: 16px;
      }
      .empty-column { display: none; }
    }

    @media (max-width: 720px) {
      /* Mobile: H1 ~doubles in size and spans full width */
      h1 { font-size: clamp(24px, 6.86vw, 47px); }
      .headline-wrap { width: 100%; max-width: 100%; }
      /* Smaller logo on mobile so it doesn't dominate */
      .logo svg { width: clamp(74px, 19.95vw, 105px); }
      :root { --page-padding: 20px; }
      :root { --bar-height: 86px; }
      .page { gap: 12px; }
      .subtitle { font-size: 17px; }
      .field input { min-height: 45px; border-radius: 8px; }
      .lead-button { border-radius: 10px; }
    }


    /* Initial state for animation */
    .char { opacity: 0; transform: translateY(60%) scale(1.08); filter: blur(14px); }
    .subtitle, .lead-form, .header { opacity: 0; }
  </style>
</head>

      <section class="content-slot">
        <div class="copy-stack">
          <div class="headline-wrap">
            <h1 data-headline>Legal Intelligence For Modern Law Practice</h1>
          </div>
          <footer class="footer">
            <p class="subtitle">
              <span class="subtitle-line">Secure, Swiss-hosted, and compliant by design; Verdix</span>
              <span class="subtitle-line">brings your firm's knowledge together so you can act on it.</span>
            </p>
          </footer>
        </div>
      </section>
    </section>

    <section class="form-column" aria-label="Contact form">
      <form class="lead-form" novalidate data-lead-form>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required />
          <p class="field-error" id="name-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="email">Business email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@company.com" required />
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="comment">Comment</label>
          <input id="comment" name="comment" type="text" autocomplete="off" placeholder="Your comment" required />
          <p class="field-error" id="comment-error" aria-live="polite"></p>
        </div>
        <div class="consent">
          <label class="consent-label" for="privacy-consent">
            <input id="privacy-consent" name="privacyConsent" type="checkbox" required />
            <span>I agree that Verdix may process my submitted contact details to respond to my inquiry. I can withdraw this consent at any time by contacting Verdix at <a href="mailto:info@verdix.ch">info@verdix.ch</a>.</span>
          </label>
          <p class="field-error" id="privacy-consent-error" aria-live="polite"></p>
        </div>
        <button class="lead-button" type="submit">
          <span class="button-inner">
            <span class="button-label">Contact Us</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </span>
        </button>
        <p class="form-status" data-form-status aria-live="polite"></p>
      </form>
      <p class="form-message" data-form-message>Thank you for your interest. Our founder will contact you shortly to present the idea.</p>
    </section>

    <section class="empty-column" aria-hidden="true"></section>

    <footer class="page-footer">
      <p class="footer-copy">© 2026 Verdix. All rights reserved.</p>
    </footer>
  </main>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    /* ── Split headline into chars wrapped in words ── */
    function splitHeadline() {
      const h1 = document.querySelector('[data-headline]');
      const text = h1.textContent;
      h1.setAttribute('aria-label', text);
      h1.textContent = '';
      const frag = document.createDocumentFragment();
      text.split(' ').forEach((word, wi, arr) => {
        const wordEl = document.createElement('span');
        wordEl.className = 'word';
        [...word].forEach(ch => {
          const c = document.createElement('span');
          c.className = 'char';
          c.textContent = ch;
          wordEl.appendChild(c);
        });
        frag.appendChild(wordEl);
      });
      h1.appendChild(frag);
    }

    /* ── GSAP intro: sequential pixelate-style reveal ── */
    function runIntroAnimation() {
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      tl.to('.header', { opacity: 1, duration: 0.6 })
        .to('.char', {
          opacity: 1,
          y: 0,
          scale: 1,
          filter: 'blur(0px)',
          duration: 0.7,
          stagger: { amount: 1.2, from: 'start' },
        }, '-=0.2')
        .fromTo('.subtitle',
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.7 }, '-=0.5')
        .fromTo('.lead-form',
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.7, onComplete: () => {
            enableButtonMicro();
            alignDesktopCopy();
          } }, '-=0.5');
    }

    function initPage() {
      splitHeadline();
      setupLeadForm();
      runIntroAnimation();
      alignDesktopCopy();
    }

    window.addEventListener('load', initPage);

    function alignDesktopCopy() {
      const root = document.documentElement;
      const h1 = document.querySelector('h1');
      const subtitle = document.querySelector('.subtitle');
      const form = document.querySelector('.lead-form');
      const button = document.querySelector('.lead-button');
      const content = document.querySelector('.content-slot');

      if (!h1 || !subtitle || !form || !button || !content) return;
      if (window.innerWidth <= 980) {
        root.style.removeProperty('--copy-gap');
        root.style.removeProperty('--copy-bottom-offset');
        return;
      }

      const h1Box = h1.getBoundingClientRect();
      const subtitleBox = subtitle.getBoundingClientRect();
      const formBox = form.getBoundingClientRect();
      const buttonBox = button.getBoundingClientRect();
      const desiredGap = buttonBox.bottom - formBox.top - h1Box.height - subtitleBox.height;

      root.style.setProperty('--copy-gap', `${Math.max(18, desiredGap)}px`);

      requestAnimationFrame(() => {
        const updatedSubtitle = subtitle.getBoundingClientRect();
        const updatedButton = button.getBoundingClientRect();
        const currentPadding = parseFloat(getComputedStyle(content).paddingBottom) || 0;
        const nextPadding = currentPadding + (updatedSubtitle.bottom - updatedButton.bottom);
        root.style.setProperty('--copy-bottom-offset', `${Math.max(0, nextPadding)}px`);
      });
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(alignDesktopCopy);
    }

    let alignCopyFrame = 0;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(alignCopyFrame);
      alignCopyFrame = requestAnimationFrame(alignDesktopCopy);
    });

    function enableButtonMicro() {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;

      const button = document.querySelector('.lead-button');
      if (!button) return;

      const inner = button.querySelector('.button-inner');
      const arrow = button.querySelector('.button-arrow');
      if (!inner || !arrow) return;

      button.addEventListener('pointerenter', () => {
        gsap.to(arrow, { x: 4, duration: 0.24, ease: 'power2.out' });
        gsap.to(button, { y: -1, scale: 1.005, duration: 0.24, ease: 'power2.out' });
      });

      button.addEventListener('pointerleave', () => {
        gsap.to(button, { y: 0, scale: 1, duration: 0.24, ease: 'power2.out' });
        gsap.to(inner, { x: 0, y: 0, duration: 0.24, ease: 'power2.out' });
        gsap.to(arrow, { x: 0, duration: 0.24, ease: 'power2.out' });
      });

      button.addEventListener('pointerdown', () => {
        gsap.to(button, { y: 0, scale: 0.995, duration: 0.1, ease: 'power2.out' });
      });
      button.addEventListener('pointerup', () => {
        gsap.to(button, { y: -1, scale: 1.005, duration: 0.18, ease: 'power2.out' });
      });
    }

    function setupLeadForm() {
      const form = document.querySelector('[data-lead-form]');
      const message = document.querySelector('[data-form-message]');
      const status = document.querySelector('[data-form-status]');
      if (!form || !message || !status) return;

      const fields = {
        name: form.elements.name,
        email: form.elements.email,
        comment: form.elements.comment,
        privacyConsent: form.elements.privacyConsent,
      };
      const errors = {
        name: document.getElementById('name-error'),
        email: document.getElementById('email-error'),
        comment: document.getElementById('comment-error'),
        privacyConsent: document.getElementById('privacy-consent-error'),
      };

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      function setError(name, text) {
        fields[name].setAttribute('aria-invalid', text ? 'true' : 'false');
        fields[name].setAttribute('aria-describedby', errors[name].id);
        errors[name].textContent = text;
      }

      function validate() {
        const values = {
          name: fields.name.value.trim(),
          email: fields.email.value.trim(),
          comment: fields.comment.value.trim(),
          privacyConsent: fields.privacyConsent.checked,
          consentText: 'I agree that Verdix may process my submitted contact details to respond to my inquiry. I can withdraw this consent at any time by contacting Verdix at info@verdix.ch.',
        };
        let valid = true;

        setError('name', '');
        setError('email', '');
        setError('comment', '');
        setError('privacyConsent', '');

        if (values.name.length < 2) {
          setError('name', 'Please enter your name.');
          valid = false;
        }
        if (!emailPattern.test(values.email)) {
          setError('email', 'Please enter a valid business email.');
          valid = false;
        }
        if (values.comment.length < 2) {
          setError('comment', 'Please enter a comment.');
          valid = false;
        }
        if (!values.privacyConsent) {
          setError('privacyConsent', 'Please confirm consent before submitting.');
          valid = false;
        }

        return { valid, values };
      }

      Object.values(fields).forEach((field) => {
        field.addEventListener(field.type === 'checkbox' ? 'change' : 'input', () => {
          status.textContent = '';
          if (field.getAttribute('aria-invalid') === 'true') validate();
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const { valid, values } = validate();
        if (!valid) return;

        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        status.textContent = '';

        try {
          if (window.location.protocol === 'file:') {
            throw new Error('Open this page through Cloudflare Pages or the local Pages dev server to submit the form.');
          }

          const response = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(values),
          });
          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(result.error || 'Something went wrong. Please try again.');
          }

          if (window.gsap) {
            gsap.to(form, {
              opacity: 0,
              y: -12,
              duration: 0.35,
              ease: 'power2.in',
              onComplete: () => {
                form.style.display = 'none';
                message.style.display = 'block';
                gsap.to(message, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' });
              },
            });
          } else {
            form.style.display = 'none';
            message.style.display = 'block';
            message.style.opacity = '1';
            message.style.transform = 'translateY(0)';
          }
        } catch (error) {
          status.textContent = error.message;
          submitButton.disabled = false;
        }
      });
    }

  </script>
